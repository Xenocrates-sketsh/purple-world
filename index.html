<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6d28d9" />
    <meta
      name="description"
      content="Purple World — your digital space for BAC English support. Lessons, exercises, grades, schedule and chat with Hafsa."
    />
    <title>Purple World — BAC English Support</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // DEBUG: surface every error visibly so the "black screen" stops being silent.
      (function () {
        function show(title, body) {
          var pre = document.getElementById("__pw_debug");
          if (!pre) {
            pre = document.createElement("pre");
            pre.id = "__pw_debug";
            pre.style.cssText =
              "position:fixed;left:0;right:0;top:0;z-index:2147483647;margin:0;padding:12px;background:#fff5f5;color:#7a0000;border:2px solid #c00;font:12px/1.4 ui-monospace,monospace;white-space:pre-wrap;max-height:70vh;overflow:auto;";
            document.body && document.body.appendChild(pre);
          }
          pre.textContent =
            (pre.textContent ? pre.textContent + "\n\n" : "") + title + "\n" + body;
          try { document.title = "ERR " + title; } catch (e) {}
        }
        window.addEventListener("error", function (e) {
          show(
            "error: " + (e.message || e),
            (e.filename || "?") + ":" + (e.lineno || "?") + ":" + (e.colno || "?") +
              (e.error && e.error.stack ? "\n" + e.error.stack : "")
          );
        });
        window.addEventListener("unhandledrejection", function (e) {
          var r = e.reason;
          show(
            "unhandledrejection: " + (r && r.message ? r.message : String(r)),
            r && r.stack ? r.stack : ""
          );
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
