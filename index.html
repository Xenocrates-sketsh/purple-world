<!doctype html>
<html lang="en" class="scroll-smooth dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#160d22" />
    <script>
      // Dark by default, no white flash: only light when explicitly chosen.
      try {
        if (localStorage.getItem("pw:theme") === "light") {
          document.documentElement.classList.remove("dark");
        }
      } catch (e) {}
    </script>
    <meta name="theme-color" content="#6d28d9" />
    <meta
      name="description"
      content="Purple World — your digital space for BAC English support. Lessons, exercises, grades, schedule and chat with Hafsa."
    />
    <title>Purple World — BAC English Support</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
